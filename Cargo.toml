# Halo Map Studio
# =============================================================================
# A standalone Halo: Reach / Halo 4 (MCC) map viewer and Forge editor.
#
#   * hms-app     - egui/eframe application: scene, editor UI, scripting, headless
#   * hms-render  - wgpu renderer + WGSL shaders
#   * hms-native  - FFI to the C++ map parser (native/, built as
#                   libhalomapstudio.so / HaloMapStudioDLL.dll)
#   * hms-ipc     - memory-mapped-file IPC with the DLL when it is injected into
#                   MCC (Windows, optional `injection` feature of hms-app)
#   * hms-inject  - inject / evict that DLL into a running MCC (Windows, optional)
#   * hms-mcp     - Model Context Protocol bridge to hms-app's script server
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/hms-inject",
    "crates/hms-ipc",
    "crates/hms-native",
    "crates/hms-render",
    "crates/hms-app",
    "crates/hms-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sopitive"]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
libloading = "0.8"
memmap2 = "0.9"

# Win32 surface used by hms-inject / hms-ipc.
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# A fast-ish dev profile — wgpu/egui are painful to run unoptimized.
[profile.dev.package."*"]
opt-level = 2
